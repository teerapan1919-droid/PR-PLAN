<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR-SUPPLY | ระบบงานพัสดุ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<!-- Script สำหรับสร้างไฟล์ Word (Docxtemplater) -->
    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.min.js"></script>
    <script src="https://unpkg.com/docxtemplater@3.37.11/build/docxtemplater.js"></script>
    <script src="https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: { fontFamily: { sans: ['Sarabun', 'sans-serif'] }, colors: { primary: '#4f46e5' } }
            }
        }
    </script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #loader { display: none; }
        .loader-active { display: flex !important; }
    </style>
</head>
<body class="text-slate-800 overflow-hidden h-screen flex">

    <!-- Global Loader -->
    <div id="loader" class="fixed inset-0 z-[100] bg-white/80 backdrop-blur-sm items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600"></div>
    </div>

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-200 h-full flex flex-col z-20 transition-all duration-300 shadow-sm hidden md:flex">
        <div class="p-6 border-b border-slate-100 flex items-center gap-3">
            <div class="bg-emerald-100 text-emerald-600 p-2 rounded-xl"><i data-lucide="shopping-cart" class="w-6 h-6"></i></div>
            <div class="font-bold text-xl tracking-tight text-slate-800">PR-SUPPLY</div>
        </div>
        
        <!-- User Profile Mini -->
        <div class="p-4 border-b border-slate-100 flex items-center gap-3 bg-slate-50/50">
            <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold" id="sb-initial"></div>
            <div class="overflow-hidden">
                <div id="sb-name" class="font-bold text-sm text-slate-800 truncate">กำลังโหลด...</div>
                <div id="sb-role" class="text-xs text-slate-500 truncate">Role</div>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1" id="desktop-menu"></nav>
        
        <div class="p-4 border-t border-slate-100">
            <button onclick="window.backToPrPlan()" class="flex items-center gap-3 text-indigo-600 hover:bg-indigo-50 px-4 py-2.5 rounded-xl w-full transition text-sm font-medium mb-2">
                <i data-lucide="pie-chart" class="w-4 h-4"></i> กลับระบบแผน
            </button>
            <button onclick="window.logout()" class="flex items-center gap-3 text-red-500 hover:bg-red-50 px-4 py-2.5 rounded-xl w-full transition text-sm font-medium">
                <i data-lucide="log-out" class="w-4 h-4"></i> ออกจากระบบ
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-50/50">
        <!-- Topbar Mobile -->
        <header class="md:hidden bg-white px-4 py-3 flex justify-between items-center z-10 border-b border-slate-200">
            <div class="font-bold text-emerald-600 flex items-center gap-2"><i data-lucide="shopping-cart" class="w-5 h-5"></i> PR-SUPPLY</div>
            <button onclick="window.backToPrPlan()" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg border border-indigo-100">กลับ PR-PLAN</button>
        </header>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto p-4 pb-24 md:pb-8 md:p-8" id="content-area"></div>
    </main>
	
	<!-- Mobile Bottom Nav -->
    <nav id="bottom-nav" class="md:hidden fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-slate-200 z-40 pb-safe">
        <div class="flex justify-around items-center h-16" id="mobile-menu-container"></div>
    </nav>

    <!-- Mobile Panel (Menu Grid) -->
    <div id="mobile-panel" class="hidden fixed inset-0 z-[60] bg-slate-900/50 backdrop-blur-sm fade-in">
        <div class="absolute bottom-16 left-0 w-full bg-white rounded-t-3xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-slate-800 flex items-center gap-2"><i data-lucide="layers" class="w-5 h-5 text-emerald-500"></i> เมนูระบบงานพัสดุ</h3>
                <button onclick="window.toggleMobilePanel()" class="bg-slate-100 p-2 rounded-full text-slate-500 hover:bg-slate-200 transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <!-- พื้นที่สำหรับปุ่มเมนู -->
            <div class="grid grid-cols-3 gap-4 max-h-[60vh] overflow-y-auto p-1" id="mobile-grid-menu"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 0. ตั้งค่าการเชื่อมต่อฐานข้อมูล & ฟังก์ชันพื้นฐาน
        // ==========================================
        const SUPABASE_URL = 'https://gemcyqflrwklazujosne.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_qnGGbcRmNQEcm92-FuklPA_sornSUeo';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const showLoader = () => document.getElementById('loader').classList.add('loader-active');
        const hideLoader = () => document.getElementById('loader').classList.remove('loader-active');
        const formatMoney = (num) => Number(num || 0).toLocaleString('th-TH');

        // ==========================================
        // 1. ตรวจสอบการ Login ด้วย LocalStorage และตรวจสอบสิทธิ์
        // ==========================================
        const sessionData = localStorage.getItem('pr_user_session');
        let AppUser = null;
        
        if (!sessionData) {
            Swal.fire({ icon: 'error', title: 'กรุณาเข้าสู่ระบบ', text: 'ไม่พบข้อมูลการเข้าสู่ระบบ', showConfirmButton: false, timer: 1500 });
            setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        } else {
            AppUser = JSON.parse(sessionData);
            
            // 🌟 ล็อกประตูหลังบ้าน: ถ้าไม่ใช่ Admin เด้งกลับหน้า index ทันที
            if (AppUser.sys_role !== 'Admin') {
                Swal.fire({ icon: 'error', title: 'ไม่อนุญาตให้เข้าถึง', text: 'คุณไม่มีสิทธิ์เข้าใช้งานระบบพัสดุครับ', showConfirmButton: false, timer: 2000 });
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            } else {
                document.getElementById('sb-name').innerText = AppUser.name;
                document.getElementById('sb-role').innerText = AppUser.sys_role;
                document.getElementById('sb-initial').innerText = AppUser.name.charAt(0);
            }
        }
		
		// ... (โค้ดตรวจสอบสิทธิ์ด้านบน) ...
        
        window.backToPrPlan = () => { window.location.href = 'index.html'; }
        window.logout = () => {
            localStorage.removeItem('pr_user_session');
            window.location.href = 'index.html';
        }

        // ==========================================
        // 2. เมนูและ Routing
        // ==========================================
        let currentRoute = 'dashboard';
        const MENU_ITEMS = [
            { id: 'dashboard', label: 'หน้าแรก', icon: 'layout-dashboard' },
            { id: 'departments', label: 'หน้ากลุ่มงาน', icon: 'briefcase' },
            { id: 'vendors', label: 'หน้าร้านค้า/ผู้รับจ้าง', icon: 'store' },
            { id: 'units', label: 'หน้ารายการหน่วยนับพัสดุ', icon: 'scale' },
            { id: 'categories', label: 'หน้ากลุ่ม/ประเภทพัสดุ', icon: 'tags' },
            { id: 'items', label: 'หน้ารายการพัสดุแนบท้าย', icon: 'package-search' },
            { id: 'procurement', label: 'หน้าจัดซื้อ/จัดจ้าง', icon: 'shopping-bag' },
            { id: 'material_acc', label: 'หน้าบัญชีวัสดุ', icon: 'book-open' },
            { id: 'asset_reg', label: 'หน้าทะเบียนคุมทรัพย์สิน', icon: 'monitor' },
            { id: 'requisition', label: 'หน้าใบเบิกพัสดุ', icon: 'file-output' }
        ];

        // ฟังก์ชันเปิด/ปิด เมนูมือถือ
        let isMobilePanelOpen = false;
        window.toggleMobilePanel = () => {
            isMobilePanelOpen = !isMobilePanelOpen;
            const panel = document.getElementById('mobile-panel');
            if(isMobilePanelOpen) { 
                panel.classList.remove('hidden'); panel.classList.add('block'); 
            } else { 
                panel.classList.add('hidden'); panel.classList.remove('block'); 
            }
        }

        function renderMenu() {
            // 1. วาดเมนูสำหรับ Desktop
            document.getElementById('desktop-menu').innerHTML = MENU_ITEMS.map(m => `
                <button onclick="window.navigate('${m.id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${currentRoute === m.id ? 'bg-emerald-50 text-emerald-700 font-bold border border-emerald-100' : 'text-slate-600 hover:bg-slate-50'}">
                    <i data-lucide="${m.icon}" class="w-5 h-5 ${currentRoute === m.id ? 'text-emerald-600' : 'text-slate-400'}"></i> ${m.label}
                </button>
            `).join('');

            // 2. วาดแถบเมนูด้านล่างสุด (Bottom Nav) สำหรับ Mobile
            const mobContainer = document.getElementById('mobile-menu-container');
            if (mobContainer) {
                mobContainer.innerHTML = `
                    <button onclick="window.navigate('dashboard')" class="flex flex-col items-center p-2 transition ${currentRoute === 'dashboard' ? 'text-emerald-600 font-bold' : 'text-slate-500 hover:text-emerald-500'}">
                        <i data-lucide="layout-dashboard" class="w-6 h-6"></i><span class="text-[10px] mt-1">หน้าแรก</span>
                    </button>
                    <button onclick="window.toggleMobilePanel()" class="flex flex-col items-center p-3 -mt-6 bg-emerald-600 text-white rounded-full shadow-lg shadow-emerald-200 transition hover:scale-105 border-4 border-white">
                        <i data-lucide="layout-grid" class="w-6 h-6"></i>
                    </button>
                    <button onclick="window.logout()" class="flex flex-col items-center p-2 text-slate-500 hover:text-red-500 transition">
                        <i data-lucide="log-out" class="w-6 h-6"></i><span class="text-[10px] mt-1">ออก</span>
                    </button>
                `;
            }

            // 3. วาดปุ่ม Grid Menu ที่จะเด้งขึ้นมาบน Mobile (ซ่อนหน้าแรกเอาไว้เพราะมีปุ่มข้างล่างแล้ว)
            const mobGrid = document.getElementById('mobile-grid-menu');
            if (mobGrid) {
                const gridItems = MENU_ITEMS.filter(m => m.id !== 'dashboard');
                mobGrid.innerHTML = gridItems.map(m => `
                    <button onclick="window.navigate('${m.id}'); window.toggleMobilePanel();" class="flex flex-col items-center p-3 rounded-xl bg-slate-50 hover:bg-emerald-50 border border-slate-100 transition shadow-sm">
                        <i data-lucide="${m.icon}" class="w-6 h-6 ${currentRoute === m.id ? 'text-emerald-600' : 'text-slate-400'} mb-2"></i>
                        <span class="text-xs text-slate-700 text-center leading-tight ${currentRoute === m.id ? 'font-bold text-emerald-700' : ''}">${m.label}</span>
                    </button>
                `).join('');
            }

            lucide.createIcons();
        }

       window.navigate = (route) => {
            currentRoute = route;
            renderMenu();
            const container = document.getElementById('content-area');
            
            if (route === 'dashboard') renderDashboardPage(container);
            else if (route === 'departments') renderDepartmentsPage(container);
            else if (route === 'vendors') renderVendorsPage(container);
            else if (route === 'units') renderUnitsPage(container);
            else if (route === 'categories') renderCategoriesPage(container);
            else if (route === 'items') renderItemsPage(container);
            else if (route === 'procurement') renderProcurementPage(container);
            
            // 🌟 เพิ่ม 2 บรรทัดนี้เพื่อให้ลิงก์ไปยังหน้าบัญชีวัสดุ และ ทะเบียนครุภัณฑ์
            else if (route === 'material_acc') renderMaterialAccPage(container);
            else if (route === 'asset_reg') renderAssetRegPage(container); 
            
            else renderPlaceholderPage(container, route);
            
            lucide.createIcons();
        }

        // ==========================================
        // 3. หน้า Dashboard (หน้าแรก) 
        // สร้างเลียนแบบตามภาพตัวอย่าง EGP EASY
        // ==========================================
        function renderDashboardPage(container) {
            container.innerHTML = `
                <div class="fade-in max-w-7xl mx-auto">
                    <!-- Banner ต้อนรับ -->
                    <div class="bg-gradient-to-r from-indigo-600 to-blue-500 rounded-2xl p-6 md:p-8 text-white mb-6 shadow-md relative overflow-hidden">
                        <div class="relative z-10">
                            <h1 class="text-2xl md:text-3xl font-bold mb-2">ยินดีต้อนรับสู่ระบบงานพัสดุ PR-SUPPLY</h1>
                            <p class="text-indigo-100 text-sm">ระบบบริหารจัดการพัสดุและจัดซื้อจัดจ้างสำหรับสถานศึกษา</p>
                        </div>
                        <i data-lucide="boxes" class="absolute -right-4 -bottom-4 w-40 h-40 text-white opacity-10"></i>
                    </div>

                    <!-- 4 กล่องสถิติ -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center group">
                            <div>
                                <div class="text-slate-500 text-xs font-bold mb-1">จำนวนจัดซื้อทั้งหมด</div>
                                <div class="text-3xl font-bold text-slate-800">0</div>
                            </div>
                            <div class="w-12 h-12 bg-red-500 text-white rounded-full flex items-center justify-center shadow-lg shadow-red-500/30 group-hover:scale-110 transition"><i data-lucide="shopping-cart" class="w-5 h-5"></i></div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center group">
                            <div>
                                <div class="text-slate-500 text-xs font-bold mb-1">จำนวนจัดจ้างทั้งหมด</div>
                                <div class="text-3xl font-bold text-slate-800">0</div>
                            </div>
                            <div class="w-12 h-12 bg-orange-500 text-white rounded-full flex items-center justify-center shadow-lg shadow-orange-500/30 group-hover:scale-110 transition"><i data-lucide="briefcase" class="w-5 h-5"></i></div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center group">
                            <div>
                                <div class="text-slate-500 text-xs font-bold mb-1">พัสดุสิ้นเปลืองทั้งหมด</div>
                                <div class="text-3xl font-bold text-slate-800">0</div>
                            </div>
                            <div class="w-12 h-12 bg-emerald-500 text-white rounded-full flex items-center justify-center shadow-lg shadow-emerald-500/30 group-hover:scale-110 transition"><i data-lucide="package" class="w-5 h-5"></i></div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center group">
                            <div>
                                <div class="text-slate-500 text-xs font-bold mb-1">มูลค่าซื้อ/จ้างทั้งหมด</div>
                                <div class="text-3xl font-bold text-slate-800">0 <span class="text-sm font-normal text-slate-400">บาท</span></div>
                            </div>
                            <div class="w-12 h-12 bg-blue-500 text-white rounded-full flex items-center justify-center shadow-lg shadow-blue-500/30 group-hover:scale-110 transition"><i data-lucide="bar-chart-2" class="w-5 h-5"></i></div>
                        </div>
                    </div>

                    <!-- 2 ตารางล่าง -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 min-h-[300px]">
                            <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2 border-b border-slate-100 pb-3"><i data-lucide="clock" class="w-5 h-5 text-red-500"></i> ข้อมูล 5 รายการจัดซื้อล่าสุด</h3>
                            <div class="flex items-center justify-center h-40 text-slate-400 text-sm">
                                ยังไม่มีข้อมูลการจัดซื้อ
                            </div>
                        </div>
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 min-h-[300px]">
                            <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2 border-b border-slate-100 pb-3"><i data-lucide="clock" class="w-5 h-5 text-orange-500"></i> ข้อมูล 5 รายการจัดจ้างล่าสุด</h3>
                            <div class="flex items-center justify-center h-40 text-slate-400 text-sm">
                                ยังไม่มีข้อมูลการจัดจ้าง
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // หน้า Placeholder สำหรับเมนูที่ยังไม่ได้ทำ
        function renderPlaceholderPage(container, route) {
            const menu = MENU_ITEMS.find(m => m.id === route);
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-slate-400 fade-in">
                    <i data-lucide="${menu.icon}" class="w-16 h-16 mb-4 text-slate-300"></i>
                    <h2 class="text-2xl font-bold text-slate-500 mb-2">${menu.label}</h2>
                    <p class="text-sm">กำลังอยู่ในขั้นตอนการพัฒนา...</p>
                </div>
            `;
        }

        // เริ่มต้นการทำงาน
        window.navigate('dashboard');
      
	  // ==========================================
        // 4. หน้ากลุ่มงาน (Departments สำหรับงานพัสดุ)
        // ==========================================
        async function renderDepartmentsPage(container) {
            showLoader();
            // 🌟 เปลี่ยนมาดึงข้อมูลจากตารางใหม่ supply_departments
            const { data: deps, error } = await supabaseClient.from('supply_departments').select('id, name').order('id', { ascending: true });
            hideLoader();

            window.currentDeps = deps || [];

            container.innerHTML = `
                <div class="mb-6 fade-in flex flex-col md:flex-row md:items-end justify-between gap-4">
                    <div>
                        <h2 class="text-2xl font-bold mb-1 flex items-center gap-2 text-emerald-700"><i data-lucide="briefcase" class="w-6 h-6"></i> ข้อมูลกลุ่มงาน</h2>
                        <p class="text-slate-500 text-sm">จัดการข้อมูลกลุ่มงาน / ฝ่าย สำหรับระบบงานพัสดุโดยเฉพาะ</p>
                    </div>
                    <button onclick="window.openDepModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl shadow-md transition font-medium flex items-center gap-2 text-sm"><i data-lucide="plus-circle" class="w-4 h-4"></i> เพิ่มข้อมูลใหม่</button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden fade-in">
                    <!-- แถบค้นหาและเลือกจำนวนแถว -->
                    <div class="p-4 border-b border-slate-100 flex flex-wrap justify-between items-center gap-4 bg-slate-50">
                        <div class="flex items-center gap-2 text-slate-600 text-sm font-medium">
                            แสดง 
                            <select class="border border-slate-300 rounded-lg px-2 py-1.5 outline-none focus:border-emerald-500 bg-white">
                                <option>25</option><option>50</option><option>100</option>
                            </select> 
                            รายการ
                        </div>
                        <div class="relative w-full md:w-auto">
                            <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                            <input type="text" id="search_dep" onkeyup="window.filterDeps()" placeholder="ค้นหากลุ่มงาน..." class="w-full md:w-64 pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
                        </div>
                    </div>

                    <!-- ตารางข้อมูล -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-100 text-slate-700 border-b border-slate-200">
                                <tr>
                                    <th class="p-3 font-semibold text-center w-24">ลำดับ</th>
                                    <th class="p-3 font-semibold">ชื่อกลุ่มงาน</th>
                                    <th class="p-3 font-semibold text-center w-32">จัดการข้อมูล</th>
                                </tr>
                            </thead>
                            <tbody id="dep_table_body" class="divide-y divide-slate-100">
                                <!-- ข้อมูลจาก JS จะมาแทรกตรงนี้ -->
                            </tbody>
                        </table>
                    </div>

                    <!-- แถบด้านล่าง (Pagination Info) -->

        window.saveCategory = async () => {
            const id = document.getElementById('c_id').value;
            const payload = {
                main_type: document.getElementById('c_main_type').value,
                group_code: document.getElementById('c_group_code').value.trim(),
                group_name: document.getElementById('c_group_name').value,
                category_code: document.getElementById('c_category_code').value.trim(),
                category_name: document.getElementById('c_category_name').value.trim()
            };
            
            if(!payload.group_code || !payload.category_code || !payload.category_name) {
                return Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกข้อมูลให้ครบถ้วน', confirmButtonColor: '#10b981' });

            // 🌟 ระบบตรวจสอบรหัสซ้ำ (รหัสกลุ่ม และ รหัสประเภท เดียวกัน)
            const isDuplicate = window.currentCategories.some(c => 
                c.id != id && // ต้องไม่ใช่รายการที่กำลังแก้ไขอยู่
                c.main_type === payload.main_type && 
                c.group_code === payload.group_code && 
                c.category_code === payload.category_code
            );

            const filteredCats = window.sysCategories.filter(c => c.main_type === filterMainType);
            catSelect.innerHTML = filteredCats.map(c => 
                `<option value="${c.group_name} - ${c.category_name}">${c.group_name} - ${c.category_name}</option>`

        window.saveItem = async () => {
            const id = document.getElementById('i_id').value;
            const payload = {
                item_group: document.getElementById('i_group').value,
                category_name: document.getElementById('i_category').value,
                depreciation: document.getElementById('i_depreciation').value,
                item_code: document.getElementById('i_code').value.trim(),
                item_name: document.getElementById('i_name').value.trim(),
                price: parseFloat(document.getElementById('i_price').value) || 0,
                quantity: parseFloat(document.getElementById('i_qty').value) || 0,
                unit_name: document.getElementById('i_unit').value
            };
            
            if(!payload.item_code || !payload.item_name || !payload.unit_name || (payload.item_group === 'ครุภัณฑ์' && !payload.depreciation)) {
                return Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกข้อมูลให้ครบถ้วน', confirmButtonColor: '#10b981' });

            const isDuplicate = window.currentItems.some(i => i.item_code === payload.item_code && i.id != id);
            if(isDuplicate) {

		// ==========================================

            const [expRes, procRes, vendorRes, schoolRes] = await Promise.all([

                            <button onclick="window.changeProcTab('buy')" class="px-4 py-2 rounded-lg text-sm font-bold transition ${procActiveTab === 'buy' ? 'bg-cyan-500 text-white shadow' : 'text-slate-500 hover:text-slate-700'}">ทะเบียนคุมจัดซื้อ</button>
                            <button onclick="window.changeProcTab('hire')" class="px-4 py-2 rounded-lg text-sm font-bold transition ${procActiveTab === 'hire' ? 'bg-rose-500 text-white shadow' : 'text-slate-500 hover:text-slate-700'}">ทะเบียนคุมจัดจ้าง</button>

                            <h3 class="font-bold flex items-center gap-2" id="proc_modal_title"><i data-lucide="file-plus" class="w-5 h-5"></i> บันทึกข้อมูลจัดซื้อ/จัดจ้าง</h3>
                            <button onclick="window.closeProcModal()" class="text-white hover:bg-white/20 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-5 h-5"></i></button>

        window.changeProcTab = (tab) => {

            window.navigate('procurement'); 
        }

            const area = document.getElementById('proc_content_area');
            let tableHtml = '';

            if (procActiveTab === 'pending') {
                window.procPendingList.forEach((req, i) => {
                    tableHtml += `
                        <tr class="hover:bg-slate-50 border-b border-slate-100 bg-white">
                            <td class="p-3 text-center text-slate-500">${i+1}</td>
                            <td class="p-3 font-medium text-blue-700">${req.request_code}</td>
                            <td class="p-3 text-slate-700">${req.project_name}</td>
                            <td class="p-3 text-slate-600">${req.requester_name}</td>
                            <td class="p-3 text-right font-bold text-red-500">${formatMoney(req.total_amount)}</td>
                            <td class="p-3 text-center">
                                <button onclick="window.openProcModal(${req.id})" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold transition shadow-sm flex items-center justify-center gap-1 mx-auto"><i data-lucide="file-edit" class="w-3 h-3"></i> ทำเอกสารซื้อ/จ้าง</button>

                list.forEach((p, i) => {

                    tableHtml += `

                            <td class="p-3 font-bold ${color}">${p.po_number}</td>

                            <td class="p-3 text-slate-800">${p.subject_name}</td>
                            <td class="p-3 text-right font-bold text-slate-700">${formatMoney(p.budget_amount)}</td>
                            <td class="p-3 text-center">
                                <div class="flex items-center justify-center gap-2">
                                    <button onclick="window.openProcModal(${p.expense_request_id}, ${p.id})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 border border-indigo-200 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm"><i data-lucide="edit" class="w-3.5 h-3.5 inline"></i> แก้ไข</button>
                                    <button onclick="window.printProcurement(${p.id})" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm flex items-center gap-1"><i data-lucide="printer" class="w-3.5 h-3.5"></i> พิมพ์</button>
                                    ${receiveBtn}
                                </div>
                            </td>
                        </tr>
                    `;
                });
                
                const titleText = procActiveTab === 'buy' ? 'ทะเบียนคุมการจัดซื้อ' : 'ทะเบียนคุมการจัดจ้าง';
                const printGlobalBtn = `<div class="mb-4 flex justify-end"><button onclick="window.printProcurementRegister('${procActiveTab}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-xl text-sm font-bold shadow-md transition flex items-center gap-2"><i data-lucide="printer" class="w-4 h-4"></i> พิมพ์${titleText}</button></div>`;
                
                area.innerHTML = printGlobalBtn + buildTableLayout(procActiveTab === 'buy' ? 'ทะเบียนคุมจัดซื้อ' : 'ทะเบียนคุมจัดจ้าง', ['เลขที่คำสั่ง', 'วันที่', 'รายการ', 'ยอดรวม (บาท)', 'จัดการ'], tableHtml, 'ยังไม่มีประวัติข้อมูล');
            }
            lucide.createIcons();

        // 🌟 ฟังก์ชันพิมพ์ทะเบียนคุมการจัดซื้อ/จัดจ้าง แบบรวมทั้งปีงบประมาณ
        window.printProcurementRegister = async (type) => {
            showLoader();
            const { data: school } = await supabaseClient.from('school_info').select('*').limit(1).single();
            hideLoader();

            const schoolName = school ? school.name : 'โรงเรียน.........................';
            const academicYear = window.sysAcademicYear || (new Date().getFullYear() + 543);
            
            const list = type === 'buy' ? window.procBuyList : window.procHireList;
            const title = type === 'buy' ? 'ทะเบียนคุมการจัดซื้อ' : 'ทะเบียนคุมการจัดจ้าง';
            const orderHeader = type === 'buy' ? 'เลขที่ใบสั่งซื้อ' : 'เลขที่ใบสั่งจ้าง';

            if (!list || list.length === 0) {
                return Swal.fire({ icon: 'info', title: 'ไม่มีข้อมูล', text: 'ยังไม่มีรายการจัดซื้อ/จัดจ้างให้พิมพ์ครับ' });
            }

            const toThaiNum = (str) => {
                if(!str && str !== 0) return '';
                return String(str).replace(/\d/g, d => '๐๑๒๓๔๕๖๗๘๙'[d]);
            };

            const formatThaiDateShort = (dateStr) => {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
                return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
            };

            let rows = '';
            list.forEach((item, index) => {
                rows += `
                    <tr>
                        <td class="text-center">${toThaiNum(index + 1)}</td>
                        <td class="text-center">${toThaiNum(item.po_number || '-')}</td>
                        <td class="text-center">${toThaiNum(formatThaiDateShort(item.po_date))}</td>
                        <td class="text-left">${toThaiNum(item.subject_name || '-')}</td>
                        <td class="text-left">${item.vendor_name || '-'}</td>
                        <td class="text-right">${toThaiNum(formatMoney(item.budget_amount))}</td>
                        <td></td>
                    </tr>
                `;
            });

            const minRows = 18;
            if (list.length < minRows) {
                for (let i = list.length; i < minRows; i++) {
                    rows += `<tr><td><br></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
                }
            }

            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head>
                    <title>${title}</title>
                    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
                    <style>
                        body { font-family: 'Sarabun', sans-serif; margin: 0; padding: 20px; font-size: 12pt; color: #000; line-height: 1.5; }
                        @page { size: A4 portrait; margin: 15mm; }
                        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12pt; }
                        th, td { border: 1px solid #000; padding: 4px 8px; font-weight: normal; }
                        th { text-align: center; }
                        .text-center { text-align: center; }
                        .text-left { text-align: left !important; padding-left: 8px; }
                        .text-right { text-align: right !important; padding-right: 8px; }
                        .header-text { text-align: center; font-size: 14pt; margin-bottom: 2px; }
                    </style>
                </head>
                <body>
                    <div class="header-text">${title}</div>
                    <div class="header-text">${schoolName}</div>
                    <div class="header-text">ประจำปีงบประมาณ ${toThaiNum(academicYear)}</div>
                    
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 6%;">ที่</th>
                                <th style="width: 18%;">${orderHeader}</th>
                                <th style="width: 14%;">ลงวันที่</th>
                                <th style="width: 28%;">รายการ</th>
                                <th style="width: 18%;">ผู้รับจ้าง/ผู้ขาย</th>
                                <th style="width: 10%;">จำนวนเงิน</th>
                                <th style="width: 6%;">หมายเหตุ</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                </body>
                </html>
            `);
            
            printWindow.document.close();
            setTimeout(() => { printWindow.print(); }, 800);
        }

        function buildTableLayout(title, headers, bodyHtml, emptyText) {
            let thead = headers.map(h => `<th class="p-3 font-semibold ${h==='ยอดรวม (บาท)'?'text-right': h==='จัดการ'?'text-center':''}">${h}</th>`).join('');
            if(!bodyHtml) bodyHtml = `<tr><td colspan="${headers.length}" class="p-8 text-center text-slate-400">${emptyText}</td></tr>`;
            return `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 bg-slate-50 border-b border-slate-200 font-bold text-slate-700 flex items-center gap-2"><i data-lucide="list" class="w-4 h-4"></i> ${title}</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap text-sm">
                            <thead class="bg-slate-100 text-slate-600 border-b border-slate-200"><tr>${thead}</tr></thead>
                            <tbody class="divide-y divide-slate-100">${bodyHtml}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        const pInput = (label, id, type='text', extra='') => `<div><label class="block text-xs font-bold text-slate-700 mb-1">${label}</label><input type="${type}" id="${id}" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-indigo-500 bg-white" ${extra}></div>`;

        // 🌟 เพิ่มฟังก์ชันคำนวณวันครบกำหนด (นับ 30 วันจากวันที่จัดจ้าง)
        window.calcEmpDueDate = () => {
            const qDate = document.getElementById('p_emp_q_date')?.value;
            if (qDate) {
                const d = new Date(qDate);
                d.setDate(d.getDate() + 30);
                const dueInput = document.getElementById('p_emp_due_date');
                if (dueInput) dueInput.value = d.toISOString().split('T')[0];
            }
        }

        window.openProcModal = async (expenseId = null, editId = null) => {
            procCurrentExpenseId = expenseId;
            let exp = {}; 
            
            if (expenseId) {
                showLoader();
                exp = (window.procPendingList.find(e => e.id === expenseId)) || await supabaseClient.from('expense_requests').select('*').eq('id', expenseId).single().then(res => res.data);
                hideLoader();
                if(!exp) return;
            }

            let data = {};
            if(editId) {
                showLoader();
                data = await supabaseClient.from('supply_procurements').select('*').eq('id', editId).single().then(res => res.data);
                hideLoader();
            }

            const getVal = (field, fallback) => data[field] !== undefined && data[field] !== null ? data[field] : fallback;
            const today = new Date().toISOString().split('T')[0];

            procCurrentItems = getVal('items', exp.items) || [];
            if (typeof procCurrentItems === 'string') {
                try { procCurrentItems = JSON.parse(procCurrentItems); } catch(e) { procCurrentItems = []; }
            }

            let vendorOptions = '<option value="">- เลือกผู้ขาย/ผู้รับจ้าง -</option>';
            window.sysVendors.forEach(v => {
                vendorOptions += `<option value="${v.id}" ${getVal('vendor_id', '') == v.id ? 'selected' : ''}>${v.vendor_name}</option>`;
            });

            const fileDisplay = exp.file_url 
                ? `<a href="${exp.file_url}" target="_blank" class="text-xs bg-indigo-50 text-indigo-600 border border-indigo-200 px-3 py-1.5 rounded-lg font-bold hover:bg-indigo-100 transition inline-flex items-center gap-1 mb-2"><i data-lucide="paperclip" class="w-3.5 h-3.5"></i> ดูไฟล์แนบจากใบขอเบิก</a>` 
                : (expenseId ? `<span class="text-xs text-slate-400">ไม่มีไฟล์แนบจากใบขอเบิก</span>` : ``);

            const defaultProcType = exp.expense_type === 'จัดจ้าง' ? 'จ้าง' : 'ซื้อ';
            const initialType = getVal('procurement_type', defaultProcType);

            document.getElementById('proc_form_body').innerHTML = `
                <input type="hidden" id="p_id" value="${editId || ''}">
                <input type="hidden" id="p_file_url" value="${exp.file_url || ''}">

                <div class="mb-2 text-right">${fileDisplay}</div>

                <!-- ส่วนที่ 1 -->
                <div class="bg-white border border-blue-200 rounded-xl overflow-hidden shadow-sm">
                    <div class="bg-blue-50 p-2.5 border-b border-blue-200 text-blue-800 font-bold text-sm">ส่วนที่ 1 ข้อมูลรายงานขอซื้อ/จ้าง</div>
                    <div class="p-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                        ${pInput('ปีงบประมาณ', 'p_year', 'text', `value="${getVal('academic_year', window.sysAcademicYear)}" oninput="window.previewPoNumber()"`)}
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">ประเภทของงาน</label>
                            <select id="p_type" class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:border-indigo-500 bg-white" onchange="window.previewPoNumber(); window.toggleProcForm();">
                                <option value="ซื้อ" ${initialType === 'ซื้อ' ? 'selected' : ''}>ซื้อ</option>
                                <option value="จ้าง" ${initialType === 'จ้าง' ? 'selected' : ''}>จ้าง</option>
                                <option value="จ้างบุคลากร" ${initialType === 'จ้างบุคลากร' ? 'selected' : ''}>จ้างบุคลากร</option>
                            </select>
                        </div>
                        ${pInput('วันที่บันทึกรายงาน', 'p_report_date', 'date', `value="${getVal('report_date', exp.doc_date || today)}"`)}
                        <div class="md:col-span-2">${pInput('ชื่อรายการที่จะซื้อ/จ้าง', 'p_subject', 'text', `value="${getVal('subject_name', '')}"`)}</div>
                        ${pInput('เหตุผล', 'p_reason', 'text', `value="${getVal('reason', '')}" onkeyup="document.getElementById('p_req_reason').value = this.value"`)}

            const standardForm = document.getElementById('form_standard');
            const personnelForm = document.getElementById('form_personnel');
            const part8 = document.getElementById('part8_container');

            if (type === 'จ้างบุคลากร') {
                standardForm.classList.add('hidden');
                personnelForm.classList.remove('hidden');
                if(part8) part8.classList.add('hidden');
            } else if (type === 'จ้าง') {
                standardForm.classList.remove('hidden');
                personnelForm.classList.add('hidden');
                if(part8) part8.classList.add('hidden');

                personnelForm.classList.add('hidden');
                if(part8) part8.classList.remove('hidden');
            }
        }

        window.previewPoNumber = async () => {
            if (document.getElementById('p_id').value) return; 
            const type = document.getElementById('p_type').value;
            const year = document.getElementById('p_year').value;
            
            if(type && year) {
                // 🌟 ให้จ้างบุคลากร รันเลขร่วมกับจ้าง
                const queryType = (type === 'จ้างบุคลากร' || type === 'จ้าง') ? ['จ้าง', 'จ้างบุคลากร'] : ['ซื้อ'];

                const { data } = await supabaseClient.from('supply_procurements')
                    .select('po_number')
                    .in('procurement_type', queryType)
                    .eq('academic_year', year)
                    .order('id', { ascending: false })
                    .limit(1);
                
                let nextNum = 1; 
                
                if (data && data.length > 0 && data[0].po_number) {
                    const lastNumStr = data[0].po_number.split('/')[0];
                    nextNum = (parseInt(lastNumStr, 10) || 0) + 1;
                }
                
                document.getElementById('p_po_num').value = String(nextNum).padStart(3, '0') + '/' + year;
            }
        }

            window.renderProcItems();
        };

        window.removeProcItem = (itemId) => {
            procCurrentItems = procCurrentItems.filter(i => i.id !== itemId);
            window.renderProcItems();
            
            const newTotalAmount = procCurrentItems.reduce((sum, item) => sum + ((parseFloat(item.qty)||0) * (parseFloat(item.price)||0)), 0);
            if (document.getElementById('p_budget')) document.getElementById('p_budget').value = newTotalAmount;
            if (document.getElementById('p_q_price')) document.getElementById('p_q_price').value = newTotalAmount;
            if (document.getElementById('p_emp_q_price')) document.getElementById('p_emp_q_price').value = newTotalAmount;
            // ลบการอัปเดต p_emp_contract_amt ออกแล้ว
        };

        window.updateProcItem = (itemId, field, value) => {
            const it = procCurrentItems.find(i => i.id === itemId);
            if(it) {
                it[field] = value;
                const total = (parseFloat(it.qty)||0) * (parseFloat(it.price)||0);
                document.getElementById(`pi_tot_${itemId}`).innerText = formatMoney(total);
                
                const newGrandTotal = procCurrentItems.reduce((sum, item) => sum + ((parseFloat(item.qty)||0) * (parseFloat(item.price)||0)), 0);
                if (document.getElementById('p_budget')) document.getElementById('p_budget').value = newGrandTotal;
                if (document.getElementById('p_q_price')) document.getElementById('p_q_price').value = newGrandTotal;

                due_date: isPersonnel ? document.getElementById('p_emp_due_date').value : document.getElementById('p_due_date').value || null,

                requisition_date: !isPersonnel && document.getElementById('p_req_date') ? document.getElementById('p_req_date').value : null,

            };

            if(!payload.subject_name || !payload.vendor_id) {
                return Swal.fire({ icon: 'warning', text: 'กรุณากรอกชื่อรายการ และเลือกผู้ขาย/ผู้รับจ้าง' });
            }

            showLoader();
            try {
                if(id) {
                    await supabaseClient.from('supply_procurements').update(payload).eq('id', id);

                    await supabaseClient.from('supply_procurements').insert([payload]);
                    
                    // 🌟 เพิ่มเงื่อนไข pType === 'ซื้อ' เข้าไปตรงนี้ครับ
                    // ถ้าระบุเป็น "จ้าง" หรือ "จ้างบุคลากร" มันจะไม่เข้าไปยุ่งกับตารางพัสดุเลย
                    if (pType === 'ซื้อ' && procCurrentItems && procCurrentItems.length > 0) {
                        const itemsToInsert = procCurrentItems.map((item, index) => ({
                            item_group: 'รอระบุกลุ่ม',
                            category_name: 'รอระบุประเภท',
                            depreciation: 'ไม่คำนวณค่าเสื่อมสภาพ',

                            quantity: parseFloat(item.qty) || 0,
                            unit_name: 'รอระบุหน่วย'
                        }));
                        await supabaseClient.from('supply_items').insert(itemsToInsert);
                    }
                }
                
                if (procCurrentExpenseId) {
                    await supabaseClient.from('expense_requests').update({
                        items: procCurrentItems,
                        total_amount: newTotalAmount
                    }).eq('id', procCurrentExpenseId);

                hideLoader();
                Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', text: 'บันทึกข้อมูลจัดซื้อ/จ้างเรียบร้อยแล้ว', showConfirmButton: false, timer: 2000 });

		// ==========================================
        // 9.1 ระบบตรวจรับพัสดุ (เชื่อมโยงจัดซื้อ ➔ คลัง/ทรัพย์สิน)
        // ==========================================
        
        let receiveCurrentProc = null;
        let receiveAllItemsInfo = [];
        
        window.openReceiveListModal = async (procId) => {
            showLoader();
            // ดึงข้อมูลจัดซื้อ, ร้านค้า, และ รายการพัสดุในระบบ (เพื่อเทียบหาประเภท วัสดุ/ครุภัณฑ์)
            const [procRes, itemRes, vendorRes] = await Promise.all([
                supabaseClient.from('supply_procurements').select('*').eq('id', procId).single(),
                supabaseClient.from('supply_items').select('*'),
                supabaseClient.from('supply_vendors').select('id, vendor_name')
            ]);
            hideLoader();

            if (!procRes.data) return;
            receiveCurrentProc = procRes.data;
            const sysItems = itemRes.data || [];
            const vendors = vendorRes.data || [];
            
            // หาชื่อร้านค้า
            const vendorObj = vendors.find(v => v.id == receiveCurrentProc.vendor_id);
            receiveCurrentProc.vendor_name = vendorObj ? vendorObj.vendor_name : '-';

            // เตรียมดึงรายการจากบิลจัดซื้อ
            let poItems = [];
            try { poItems = typeof receiveCurrentProc.items === 'string' ? JSON.parse(receiveCurrentProc.items) : receiveCurrentProc.items; } catch(e) {}

            let matHtml = '';
            let assetHtml = '';
            let matCount = 0, assetCount = 0;
            
            // เก็บข้อมูลรวมไว้ใช้งานต่อตอนกดปุ่ม
            receiveAllItemsInfo = [];

            poItems.forEach((poItem, index) => {
                // หารายการที่ตรงกันใน supply_items (เทียบจากชื่อและราคา)
                const matchedItem = sysItems.find(si => si.item_name === poItem.name && si.price == poItem.price);
                
                // ตรวจสอบสถานะการรับของ (เช็คจากตัวแปรที่เราจะแอบฝังไว้ตอนบันทึก)
                const isReceived = poItem.received === true;
                const btnStatus = isReceived 
                    ? `<button disabled class="bg-slate-300 text-slate-500 px-3 py-1.5 rounded-lg text-xs font-bold cursor-not-allowed w-full"><i data-lucide="check" class="w-3.5 h-3.5 inline"></i> ตรวจรับแล้ว</button>`
                    : `<button onclick="window.processReceiveItem(${index})" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition flex items-center justify-center gap-1 w-full"><i data-lucide="download" class="w-3.5 h-3.5"></i> ตรวจรับพัสดุ</button>`;

                let groupType = 'วัสดุ'; // ค่าเริ่มต้น
                let rowData = { ...poItem, index: index, matched_info: matchedItem || {} };
                
                if (matchedItem) {
                    if (matchedItem.item_group === 'ครุภัณฑ์') groupType = 'ครุภัณฑ์';
                    else if (matchedItem.item_group === 'รอระบุกลุ่ม') groupType = 'รอระบุ';
                } else {
                    groupType = 'ไม่พบในระบบ';
                }
                
                receiveAllItemsInfo.push(rowData);

                const renderRow = (no, code, name, qty, price, total) => `
                    <tr class="border-b border-slate-100 hover:bg-slate-50 bg-white">
                        <td class="p-2 text-center text-slate-500">${no}</td>
                        <td class="p-2 text-slate-600 font-medium">${code || '-'}</td>
                        <td class="p-2 text-slate-800 font-medium">${name}</td>
                        <td class="p-2 text-center text-slate-600">${qty}</td>
                        <td class="p-2 text-right text-slate-600">${formatMoney(price)}</td>
                        <td class="p-2 text-right font-bold text-indigo-600">${formatMoney(total)}</td>
                        <td class="p-2 text-center">${btnStatus}</td>
                    </tr>
                `;

                const totalStr = (parseFloat(poItem.qty)||0) * (parseFloat(poItem.price)||0);
                
                if (groupType === 'ครุภัณฑ์') {
                    assetCount++;
                    assetHtml += renderRow(assetCount, matchedItem?.item_code, poItem.name, poItem.qty, poItem.price, totalStr);
                } else {
                    // ถ้าเป็น 'วัสดุ', 'รอระบุ' หรือ 'ไม่พบในระบบ' ให้โยนเข้าหมวดวัสดุไว้ก่อน
                    matCount++;
                    let nameDisplay = poItem.name;
                    if(groupType === 'รอระบุ' || groupType === 'ไม่พบในระบบ') {
                        nameDisplay += `<br><span class="text-[10px] text-red-500 font-bold bg-red-50 px-1 rounded">* รหัสชั่วคราว (กรุณาไปอัปเดตข้อมูลในหน้าพัสดุก่อน)</span>`;
                    }
                    matHtml += renderRow(matCount, matchedItem?.item_code, nameDisplay, poItem.qty, poItem.price, totalStr);
                }
            });

            document.getElementById('receive_list_body').innerHTML = `
                <div class="mb-4 bg-teal-50 p-4 rounded-xl border border-teal-200 flex justify-between items-center">
                    <div>
                        <div class="font-bold text-teal-800">อ้างอิงเอกสาร: ${receiveCurrentProc.po_number || '-'}</div>
                        <div class="text-sm text-teal-700 mt-1">เรื่อง: ${receiveCurrentProc.subject_name}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs text-teal-600 font-bold">ผู้ขาย/รับจ้าง</div>
                        <div class="text-sm font-medium text-teal-800">${receiveCurrentProc.vendor_name}</div>
                    </div>
                </div>

                <div class="font-bold text-slate-800 mb-2 mt-6 flex items-center gap-2"><i data-lucide="package" class="w-5 h-5 text-indigo-500"></i> รายการวัสดุ (รับเข้าบัญชีวัสดุ)</div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-100 text-slate-600">
                                <tr>
                                    <th class="p-3 font-semibold text-center w-12">ลำดับ</th>
                                    <th class="p-3 font-semibold">รหัสพัสดุ</th>
                                    <th class="p-3 font-semibold w-1/3">ชื่อพัสดุ</th>
                                    <th class="p-3 font-semibold text-center w-20">จำนวน</th>
                                    <th class="p-3 font-semibold text-right">ราคาต่อชิ้น</th>
                                    <th class="p-3 font-semibold text-right">ราคารวม</th>
                                    <th class="p-3 font-semibold text-center w-28">ตรวจรับพัสดุ</th>
                                </tr>
                            </thead>
                            <tbody>${matHtml || `<tr><td colspan="7" class="p-6 text-center text-slate-400">ไม่มีรายการวัสดุ</td></tr>`}</tbody>
                        </table>
                    </div>
                </div>

                <div class="font-bold text-slate-800 mb-2 flex items-center gap-2"><i data-lucide="monitor" class="w-5 h-5 text-blue-500"></i> รายการครุภัณฑ์ (รับเข้าทะเบียนคุมทรัพย์สิน)</div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm whitespace-nowrap">
                            <thead class="bg-slate-100 text-slate-600">
                                <tr>
                                    <th class="p-3 font-semibold text-center w-12">ลำดับ</th>
                                    <th class="p-3 font-semibold">รหัสครุภัณฑ์</th>
                                    <th class="p-3 font-semibold w-1/3">ชื่อครุภัณฑ์</th>
                                    <th class="p-3 font-semibold text-center w-20">จำนวน</th>
                                    <th class="p-3 font-semibold text-right">ราคาต่อชิ้น</th>
                                    <th class="p-3 font-semibold text-right">ราคารวม</th>
                                    <th class="p-3 font-semibold text-center w-28">ตรวจรับพัสดุ</th>
                                </tr>
                            </thead>
                            <tbody>${assetHtml || `<tr><td colspan="7" class="p-6 text-center text-slate-400">ไม่มีรายการครุภัณฑ์</td></tr>`}</tbody>
                        </table>
                    </div>
                </div>
            `;
            
            document.getElementById('receive-list-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        window.processReceiveItem = (itemIndex) => {
            const data = receiveAllItemsInfo.find(i => i.index === itemIndex);
            if (!data) return;

            const isAsset = data.matched_info?.item_group === 'ครุภัณฑ์';
            const today = new Date().toISOString().split('T')[0];

            if (isAsset) {
                // เปิดฟอร์มรับครุภัณฑ์
                document.getElementById('r_asset_proc_id').value = receiveCurrentProc.id;
                document.getElementById('r_asset_item_idx').value = itemIndex;
                
                document.getElementById('r_asset_year').value = receiveCurrentProc.academic_year || window.sysAcademicYear;
                // ดึงรหัสประเภท (แยกส่วนจาก category_name ที่เราเก็บรวมไว้ใน supply_items ตอนบันทึก)
                let catNameFull = data.matched_info?.category_name || '';
                document.getElementById('r_asset_catcode').value = catNameFull.split(' - ')[0] || '-';
                document.getElementById('r_asset_catname').value = catNameFull.split(' - ')[1] || '-';
                
                document.getElementById('r_asset_code').value = '';
                document.getElementById('r_asset_name').value = data.name;
                document.getElementById('r_asset_desc').value = '';
                document.getElementById('r_asset_loc').value = '';
                document.getElementById('r_asset_vendor').value = receiveCurrentProc.vendor_name;
                document.getElementById('r_asset_unit').value = data.matched_info?.unit_name || 'ชิ้น';
                document.getElementById('r_asset_life').value = 5;
                document.getElementById('r_asset_acq_date').value = today;
                window.calcExpireDate(); // คำนวณวันหมดอายุทันที
                document.getElementById('r_asset_price').value = formatMoney(data.price);
                
                document.getElementById('receive-asset-modal').classList.remove('hidden');
            } else {
                // เปิดฟอร์มรับวัสดุ
                document.getElementById('r_mat_proc_id').value = receiveCurrentProc.id;
                document.getElementById('r_mat_item_idx').value = itemIndex;
                document.getElementById('r_mat_price').value = data.price;
                document.getElementById('r_mat_unit').value = data.matched_info?.unit_name || 'ชิ้น';
                
                document.getElementById('r_mat_code').value = data.matched_info?.item_code || '-';
                document.getElementById('r_mat_name').value = data.name;
                document.getElementById('r_mat_max').value = '';
                document.getElementById('r_mat_min').value = '';
                document.getElementById('r_mat_detail').value = '';
                document.getElementById('r_mat_loc').value = '';
                document.getElementById('r_mat_vendor').value = receiveCurrentProc.vendor_name;
                document.getElementById('r_mat_docno').value = '';
                document.getElementById('r_mat_date').value = today;
                document.getElementById('r_mat_qty').value = data.qty;

                document.getElementById('receive-material-modal').classList.remove('hidden');
            }
        }

        window.calcExpireDate = () => {
            const acqDate = document.getElementById('r_asset_acq_date').value;
            const life = parseInt(document.getElementById('r_asset_life').value) || 0;
            if(acqDate && life > 0) {
                const d = new Date(acqDate);
                d.setFullYear(d.getFullYear() + life);
                document.getElementById('r_asset_exp_date').value = d.toISOString().split('T')[0];
            } else {
                document.getElementById('r_asset_exp_date').value = '';
            }
        }

        // ==========================================
        // ฟังก์ชันกดบันทึกรับเข้า
        // ==========================================
        window.markItemAsReceivedInProcurement = async (procId, itemIndex) => {
            let poItems = typeof receiveCurrentProc.items === 'string' ? JSON.parse(receiveCurrentProc.items) : receiveCurrentProc.items;
            if (poItems[itemIndex]) {
                poItems[itemIndex].received = true;
                await supabaseClient.from('supply_procurements').update({ items: poItems }).eq('id', procId);
                // อัปเดตตัวแปรในหน่วยความจำเพื่อรีเฟรชหน้าจอได้ทันที
                receiveCurrentProc.items = poItems;
            }
        }

        window.saveReceiveMaterial = async () => {
            const payload = {
                item_code: document.getElementById('r_mat_code').value,
                item_name: document.getElementById('r_mat_name').value,
                max_qty: parseFloat(document.getElementById('r_mat_max').value) || 0,
                min_qty: parseFloat(document.getElementById('r_mat_min').value) || 0,
                detail: document.getElementById('r_mat_detail').value.trim(),
                location: document.getElementById('r_mat_loc').value.trim(),
                vendor_name: document.getElementById('r_mat_vendor').value,
                doc_no: document.getElementById('r_mat_docno').value.trim(),
                receive_date: document.getElementById('r_mat_date').value,
                quantity: parseFloat(document.getElementById('r_mat_qty').value) || 0,
                price: parseFloat(document.getElementById('r_mat_price').value) || 0,
                unit_name: document.getElementById('r_mat_unit').value,
                requester_name: receiveCurrentProc.requester_name || 'ไม่ระบุชื่อผู้เบิก' 
            };

            if(!payload.doc_no || !payload.detail || !payload.location) {
                return Swal.fire({ icon: 'warning', text: 'กรุณากรอกข้อมูลที่มีเครื่องหมายดอกจันสีแดงให้ครบถ้วนครับ' });
            }

            showLoader();
            try {
                // 1. บันทึกลงตารางบัญชีวัสดุ
                await supabaseClient.from('supply_material_records').insert([payload]);
                
                // 🌟 2. ล้างสต๊อกในหน้าพัสดุให้เป็น 0 ทันที (รับเข้าปุ๊บ จ่ายออกปั๊บ)
                await supabaseClient.from('supply_items').update({ quantity: 0 }).eq('item_code', payload.item_code);

                // 3. อัปเดตสถานะในเอกสารจัดซื้อว่ารับแล้ว
                const procId = document.getElementById('r_mat_proc_id').value;
                const idx = parseInt(document.getElementById('r_mat_item_idx').value);
                await window.markItemAsReceivedInProcurement(procId, idx);
                
                hideLoader();
                Swal.fire({ icon: 'success', title: 'รับเข้าและจ่ายออกสำเร็จ!', text: 'ระบบปรับสต๊อกเป็น 0 และบันทึกเข้าบัญชีวัสดุเรียบร้อยแล้ว', showConfirmButton: false, timer: 2500 });
                document.getElementById('receive-material-modal').classList.add('hidden');
                window.openReceiveListModal(procId); 
            } catch(e) { hideLoader(); Swal.fire({ icon: 'error', text: e.message }); }
        }

        window.saveReceiveAsset = async () => {
            const payload = {
                budget_year: document.getElementById('r_asset_year').value,
                category_code: document.getElementById('r_asset_catcode').value,
                category_name: document.getElementById('r_asset_catname').value,
                asset_code: document.getElementById('r_asset_code').value.trim(),
                asset_name: document.getElementById('r_asset_name').value,
                description: document.getElementById('r_asset_desc').value.trim(),
                location: document.getElementById('r_asset_loc').value.trim(),
                vendor_name: document.getElementById('r_asset_vendor').value,
                fund_type: document.getElementById('r_asset_fund').value,
                acquire_method: document.getElementById('r_asset_method').value,
                unit_name: document.getElementById('r_asset_unit').value,
                lifespan_years: parseInt(document.getElementById('r_asset_life').value) || 0,
                acquire_date: document.getElementById('r_asset_acq_date').value,
                expire_date: document.getElementById('r_asset_exp_date').value || null,
                price: parseFloat(document.getElementById('r_asset_price').value.replace(/,/g, '')) || 0,
                record_method: document.getElementById('r_asset_record_type').value
            };

            if(!payload.asset_code || !payload.description || !payload.location) {
                return Swal.fire({ icon: 'warning', text: 'กรุณากรอกรหัสครุภัณฑ์ คำอธิบาย และสถานที่ตั้งให้ครบถ้วนครับ' });
            }

            showLoader();
            try {
                // บันทึกลงตารางทะเบียนคุมทรัพย์สิน
                await supabaseClient.from('supply_asset_records').insert([payload]);
                
                // อัปเดตสถานะในเอกสารจัดซื้อ
                const procId = document.getElementById('r_asset_proc_id').value;
                const idx = parseInt(document.getElementById('r_asset_item_idx').value);
                await window.markItemAsReceivedInProcurement(procId, idx);
                
                hideLoader();
                Swal.fire({ icon: 'success', title: 'รับเข้าทะเบียนทรัพย์สินสำเร็จ', showConfirmButton: false, timer: 1500 });
                document.getElementById('receive-asset-modal').classList.add('hidden');
                window.openReceiveListModal(procId); // รีเฟรช Modal รายการ
            } catch(e) { hideLoader(); Swal.fire({ icon: 'error', text: e.message }); }
        }
		
		// ==========================================
        // 10. หน้าบัญชีวัสดุ (Material Account) และการพิมพ์
        // ==========================================
        async function renderMaterialAccPage(container) {

            let rows = '';

                rows += `

                        <td class="p-3 text-slate-700 font-medium">${r.item_code}</td>
                        <td class="p-3 text-blue-700 font-bold">${r.item_name}</td>
                        <td class="p-3 text-right font-medium text-slate-700">${formatMoney(r.price)}</td>
                        <td class="p-3 text-center text-slate-700">${r.quantity}</td>
                        <td class="p-3 text-center text-emerald-600 font-bold">${currentRemain}</td>

		const ThaiBaht = (amountStr) => {
            const num = parseFloat(amountStr || 0).toFixed(2);
            if (num === '0.00') return 'ศูนย์บาทถ้วน';
            const parts = num.split('.');
            let baht = parts[0], satang = parts[1];
            const text = ['ศูนย์', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
            const unit = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน', 'ล้าน'];
            const convert = (n) => {
                let res = '';
                for (let i = 0; i < n.length; i++) {
                    const digit = parseInt(n[i]);
                    if (digit !== 0) {
                        if (i === n.length - 1 && digit === 1 && n.length > 1 && n[i-1] != '0') res += 'เอ็ด';
                        else if (i === n.length - 2 && digit === 2) res += 'ยี่';
                        else if (i === n.length - 2 && digit === 1) res += '';
                        else res += text[digit];
                        res += unit[n.length - 1 - i];
                    }
                }
                return res;
            };
            let result = convert(baht) + 'บาท';
            if (satang === '00') result += 'ถ้วน';
            else result += convert(satang) + 'สตางค์';
            return result;
        };

                if (!matchedTpl) return Swal.fire({ icon: 'error', title: 'ไม่พบแบบฟอร์ม', text: 'ระบบต้องการแบบฟอร์มที่มีชื่อ "จ้างบุคลากร" ในชื่อไฟล์ (เมนู Template)' });
            } else {
                const keyword1 = p.procurement_type === 'ซื้อ' ? 'ซื้อ' : 'จ้าง';
                matchedTpl = tpls.find(t => {
                    const tName = String(t.name).replace(/\s+/g, '');
                    const hasType = tName.includes(keyword1);
                    if (!hasType) return false;
                    
                    if (isOver5000) {
                        return tName.includes('เกิน') && !tName.includes('ไม่เกิน');
                    } else {
                        return tName.includes('ไม่เกิน');
                    }
                });
                if (!matchedTpl) return Swal.fire({ icon: 'error', title: 'ไม่พบแบบฟอร์ม', text: `ระบบต้องการแบบฟอร์มที่มีคำว่า "${keyword1}" และ "เกิน/ไม่เกิน" ในชื่อไฟล์ (เมนู Template)` });
            }

            const { value: formValues } = await Swal.fire({
                title: 'พิมพ์เอกสารจัดซื้อ/จัดจ้าง',
                html: `
                    <div class="text-left space-y-4">
                        <div class="p-3 bg-blue-50 text-blue-700 rounded-lg text-sm border border-blue-200">
                            <b>ระบบเลือกแบบฟอร์มอัตโนมัติ:</b><br>${matchedTpl.name}
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">เลขที่ใบส่งของ / ใบแจ้งหนี้ (ถ้ามี)</label>
                            <input id="swal_receipt" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-indigo-500" placeholder="เว้นว่างไว้เพื่อเขียนทีหลังได้">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-1">เลขที่ใบตรวจรับ (ถ้ามี)</label>
                            <input id="swal_inspect_no" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-indigo-500" placeholder="เว้นว่างไว้เพื่อเขียนทีหลังได้">
                        </div>
                    </div>
                `,
                focusConfirm: false, showCancelButton: true, confirmButtonText: 'สร้างเอกสาร', cancelButtonText: 'ยกเลิก',
                preConfirm: () => ({ receiptNo: document.getElementById('swal_receipt').value || '', inspectNo: document.getElementById('swal_inspect_no').value || '' })
            });

            if (!formValues) return;
            showLoader();
            try {
                const school = schoolRes.data || {};
                const v = vRes.data || null;
                
                const vendorType = v ? v.vendor_type : 'บุคคลธรรมดา';
                let preVat = amt;
                let vat = 0;
                let tax1 = 0;

                if (vendorType === 'นิติบุคคล') {
                    vat = (amt * 7) / 107;
                    preVat = amt - vat;
                }

                if (vendorType === 'นิติบุคคล' && amt >= 500) {
                    tax1 = preVat * 0.01;
                } else if (vendorType === 'บุคคลธรรมดา' && amt >= 10000) {
                    tax1 = preVat * 0.01;
                }

                const fine = Number(p.late_days) > 0 ? (amt * 0.002 * Number(p.late_days)) : 0;
                const netPay = amt - tax1 - fine;

                const formatD = (dStr) => {
                    if(!dStr) return '';
                    const d = new Date(dStr);
                    if(isNaN(d.getTime())) return '';
                    const ms = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
                    return `${d.getDate()} ${ms[d.getMonth()]} ${d.getFullYear()+543}`;
                };

                let parsedItems = [];
                try { parsedItems = typeof p.items === 'string' ? JSON.parse(p.items) : (p.items || []); } catch(e) { parsedItems = []; }

                // เตรียมข้อมูลลูปตารางปกติ
                const itemsForWord = parsedItems.map((it, idx) => ({
                    "ที่": idx + 1, 
                    "รายการ": it.name || '', 
                    "จำนวนหน่วย": it.qty || '', "จำนวนหน่วย ": it.qty || '', "จำนวน": it.qty || '',
                    "ราคาต่อหน่วย": formatMoney(it.price), "ราคาต่อหน่วย ": formatMoney(it.price),
                    "ราคารวมรายการ": formatMoney(Number(it.qty)*Number(it.price)), "ราคารวมรายการ ": formatMoney(Number(it.qty)*Number(it.price))
                }));

                // สำหรับจ้างบุคลากรที่มักมีแค่ 1 รายการ และอาจไม่ใช้ Tag วนลูป <<#items>> ในตาราง
                const firstItem = parsedItems[0] || {};
                const firstItemQty = parseFloat(firstItem.qty) || 0;
                const firstItemPrice = parseFloat(firstItem.price) || 0;

                const subjBuy = p.procurement_type === 'ซื้อ' ? (p.subject_name||'') : '';
                const subjHire = (p.procurement_type === 'จ้าง' || p.procurement_type === 'จ้างบุคลากร') ? (p.subject_name||'') : '';

                const dataToFill = {
                    "วันที่ตรวจรับ": formatD(p.inspection_date), 
                    "ขอซื้อ": subjBuy, "ขอซื้อ ": subjBuy, 
                    "ขอจ้าง": subjHire, "ขอจ้าง ": subjHire,
                    "จำนวน": parsedItems.length, 
                    "ราคา": formatMoney(amt), 
                    "ยอดเงินรวมตัวอักษร": ThaiBaht(amt), 
                    "เลขที่ใบสั่งซื้อ": p.po_number || '', "เลขที่ใบสั่งจ้าง": p.po_number || '',
                    "เลขที่จัดซื้อ": p.po_number || '', "เลขที่จัดจ้าง": p.po_number || '',
                    "วันที่จัดซื้อ": formatD(p.po_date), "วันที่จัดจ้าง": formatD(p.po_date), 
                    "วันครบกำหนดส่ง": formatD(p.due_date), "วันที่ครบกำหนด": formatD(p.due_date),
                    "เลขที่ใบเสร็จ": formValues.receiptNo, "เลขที่ใบส่งของ": formValues.receiptNo, 
                    "มูลค่าสินค้า": formatMoney(preVat), "มูลค่า": formatMoney(preVat),
                    "VAT 7%": formatMoney(vat), "VAT7%": formatMoney(vat), "VAT": formatMoney(vat), 
                    "ส่วนลด": "0.00", 
                    "หักภาษี 1%": formatMoney(tax1), "หักภาษี1%": formatMoney(tax1), 
                    "ค่าปรับ": formatMoney(fine), 
                    "รวมจ่ายจริง": formatMoney(netPay), "รวมจ่ายจริง ": formatMoney(netPay),
                    "กลุ่ม/งาน": p.department_name || '', 
                    "ชื่อโครงการ": p.project_name || '', 
                    "เพื่อ": p.reason || '', 
                    "จำนวนวัน": p.delivery_days || p.delivery_duration || '....', "จำนวนวันส่ง": p.delivery_duration || p.delivery_days || '....',
                    "ชื่อประธานกรรมการ": p.comm_1 || '', "ชื่อกรรมการ1": p.comm_2 || '', "ชื่อกรรมการ2": p.comm_3 || '',
                    
                    "ตำแหน่งประธาน": "ประธานกรรมการ", 
                    "ตำแหน่งกรรมการ1": "กรรมการ", 
                    "ตำแหน่งกรรมการ2": "กรรมการ",
                    "ตำแหน่งงานประธาน": getPosition(p.comm_1),
                    "ตำแหน่งงานกรรมการ1": getPosition(p.comm_2),
                    "ตำแหน่งงานกรรมการ2": getPosition(p.comm_3),
                    
                    "ชื่อเจ้าหน้าที่": school.procurement_officer || '', 
                    "ที่อยู่ร้าน": v ? v.address : '', "เบอร์ร้าน": v ? v.phone : '', "เบอร์ร้าน ": v ? v.phone : '',
                    "เลขเสียภาษี": v ? v.tax_id : '', "เลขเสียภาษี ": v ? v.tax_id : '', 
                    "วันที่ขอ": formatD(p.report_date), "เลขที่ตรวจรับ": formValues.inspectNo,
                    "ผู้เบิก": p.requester_name || '', "ชื่อผู้เบิก": p.requester_name || '', 
                    "ตำแหน่งผู้เบิก": getPosition(p.requester_name), 
                    
                    "เล่มที่": "......", "เลขที่": "......",
                    "items": itemsForWord,

                    // 🌟 2. ตัวแปรใหม่เฉพาะของ "จ้างบุคลากร" 
                    "ชื่อผู้รับจ้าง": v ? v.vendor_name : (p.vendor_name || ''),
                    "ที่อยู่": v ? v.address : '',
                    "เบอร์": v ? v.phone : '',
                    "ตำแหน่ง": p.emp_position || '',
                    "สัญญาจ้างที่": p.contract_no || '',
                    "คำสั่งจ้าง": p.order_no || '',
                    "ตั้งแต่วันที่": formatD(p.contract_start),
                    "ถึงวันที่": formatD(p.contract_end),
                    "วงเงิน": formatMoney(p.contract_limit || 0),
                    "วงเงินรวมตัวอักษร": ThaiBaht(p.contract_limit || 0),
                    "ประจำเดือน": p.work_month || '',
                    "วันแรกของเดือน": formatD(p.work_start),
                    "วันสุดท้ายของเดือน": formatD(p.work_end),
                    
                    // 🌟 ซัพพอร์ตกรณีที่ Template จ้างบุคลากร ไม่ได้ใช้ Tag วนลูป <<#items>>
                    "ที่": 1,
                    "รายการ": firstItem.name || '',
                    "ราคาต่อหน่วย": formatMoney(firstItemPrice),
                    "จำนวนเงิน": formatMoney(firstItemQty * firstItemPrice)
                };

                const response = await fetch(matchedTpl.file_url);
                const zip = new window.PizZip(await response.arrayBuffer());
                
                const doc = new window.docxtemplater(zip, { 
                    paragraphLoop: true, linebreaks: true, delimiters: { start: '<<', end: '>>' },
                    nullGetter: function(part) {
                        if (!part.module) return ".........................";
                        return "";
                    }
                });
                
                doc.render(dataToFill);
                const out = doc.getZip().generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
                
                hideLoader();
                window.saveAs(out, `เอกสาร${p.procurement_type}_${(p.po_number||'รอดำเนินการ').replace('/','-')}.docx`);
            } catch (error) {
                hideLoader(); Swal.fire({ icon: 'error', title: 'สร้างเอกสารล้มเหลว', text: 'กรุณาตรวจสอบว่ามีแท็กพิมพ์ผิด หรือยังไม่ได้ใส่ <<#items>> ในไฟล์ Template หรือไม่' });
            }
        };
	
    </script>
</body>
</html>
